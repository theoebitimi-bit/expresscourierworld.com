<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Express Courier | Staff Portal</title><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:900px;margin:50px auto;padding:24px}.admin form{display:grid;gap:10px;margin:20px 0}.admin input,.admin textarea{padding:12px;border:1px solid #ccd8e2;border-radius:6px}.admin section{border:1px solid #dce6ef;border-radius:9px;padding:20px;margin:18px 0}.admin pre{white-space:pre-wrap;background:#f2f7fb;padding:14px;border-radius:7px}</style></head><body><div class="admin"><a class="brand" href="/"><span class="brandmark">EC</span><span>EXPRESS <b>COURIER</b><small>STAFF PORTAL</small></span></a><h1>Shipment administration</h1><section id="loginPanel"><h2>Staff sign-in</h2><form id="login"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button class="btn primary">Sign in</button></form><p id="loginMsg"></p></section><div id="dashboard" hidden><section><h2>Create shipment</h2><form id="create"><input name="trackingNumber" placeholder="Tracking number" required><input name="recipient" placeholder="Recipient name" required><input name="destination" placeholder="Destination" required><input name="status" placeholder="Initial status" value="Shipment information received"><button class="btn primary">Create shipment</button></form><p id="createMsg"></p></section><section><h2>Add tracking update</h2><form id="event"><input name="trackingNumber" placeholder="Tracking number" required><input name="status" placeholder="New status" required><input name="location" placeholder="Current location" required><textarea name="note" placeholder="Optional note"></textarea><button class="btn primary">Add update</button></form><p id="eventMsg"></p></section><section><h2>Recent shipments</h2><button id="refresh" class="btn ghost">Refresh list</button><pre id="shipments">Sign in to view shipments.</pre></section><button id="logout" class="btn ghost">Sign out</button></div></div><script src="/admin.js"></script></body></html>
